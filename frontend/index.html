<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Assistente IA</title>
    <link rel="stylesheet" href="style.css">

    <!-- Marked.js: traduz o Markdown da IA para HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- DOMPurify: limpa o HTML gerado (segurança contra XSS) -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h3>🤖 Assistente Gemini</h3>
            <div class="header-botoes">
                <button id="btnLimpar" onclick="limparConversa()">🗑️ Limpar Conversa</button>
                <button id="btnDownload" onclick="baixarPDF()">📥 Baixar PDF</button>
            </div>
        </div>

        <div id="chat-box" class="chat-box">
            <!-- Mensagens aparecem aqui -->
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Digite sua pergunta..." onkeydown="verificarTecla(event)">
            <button id="btnEnviar" onclick="enviar()">Enviar</button>
        </div>
    </div>

    <script>
        // ====== CONFIGURAÇÃO ======
        // Local: usa o localhost. Na Vercel: troque pela URL do seu back-end no Render.
        const API_RENDER = 'https://t1-p2-a7-decolagem-global-deploy-paas-e.onrender.com';
        const ehLocal = ['localhost', '127.0.0.1', ''].includes(location.hostname);
        const API_URL = ehLocal ? 'http://localhost:3000' : API_RENDER;

        const MENSAGEM_INICIAL = 'Olá! Como posso te ajudar hoje?';
        let conversaCompleta = ''; // Armazena o texto para o PDF

        // ====== CHAT ======
        async function enviar() {
            const input = document.getElementById('userInput');
            const texto = input.value.trim();
            if (!texto) return;

            exibirMensagem(texto, 'user');
            input.value = '';
            conversaCompleta += `Usuário: ${texto}\n`;

            const carregando = exibirMensagem('Digitando...', 'ai carregando');
            alternarEnvio(false);

            try {
                const response = await fetch(`${API_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pergunta: texto })
                });
                const dados = await response.json();
                carregando.remove();

                if (!response.ok) throw new Error(dados.erro || 'Erro no servidor');

                exibirMensagem(dados.resposta, 'ai');
                conversaCompleta += `IA: ${dados.resposta}\n\n`;
            } catch (e) {
                carregando.remove();
                exibirMensagem('⚠️ Erro ao conectar com o servidor.', 'ai');
                console.error(e);
            } finally {
                alternarEnvio(true);
            }
        }

        function exibirMensagem(texto, tipo) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `msg ${tipo}`;

            if (tipo === 'ai') {
                // O Upgrade: Markdown -> HTML (limpo pelo DOMPurify)
                const respostaFormatada = marked.parse(texto);
                div.innerHTML = DOMPurify.sanitize(respostaFormatada);
            } else {
                div.innerText = texto; // Texto do usuário não precisa de formatação
            }

            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        function alternarEnvio(ativo) {
            document.getElementById('btnEnviar').disabled = !ativo;
            document.getElementById('userInput').disabled = !ativo;
            if (ativo) document.getElementById('userInput').focus();
        }

        function verificarTecla(e) {
            if (e.key === 'Enter') enviar();
        }

        // ====== LIMPAR CONVERSA (Front + Back + Banco) ======
        async function limparConversa() {
            if (!confirm('Apagar toda a conversa e a memória da IA?')) return;

            const btn = document.getElementById('btnLimpar');
            btn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/api/chat/limpar`, { method: 'DELETE' });
                const dados = await response.json();
                if (!response.ok) throw new Error(dados.erro);

                document.getElementById('chat-box').innerHTML = '';
                conversaCompleta = '';
                exibirMensagem(MENSAGEM_INICIAL, 'ai');
            } catch (e) {
                alert('Não foi possível limpar o histórico.');
                console.error(e);
            } finally {
                btn.disabled = false;
            }
        }

        // ====== PDF ======
        async function baixarPDF() {
            if (!conversaCompleta) return alert('Inicie uma conversa primeiro!');

            const btn = document.getElementById('btnDownload');
            btn.innerText = '⏳ Gerando...';

            try {
                const response = await fetch(`${API_URL}/api/pdf`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ historico: conversaCompleta })
                });
                if (!response.ok) throw new Error('Erro ao gerar PDF');

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'resumo_conversa.pdf';
                a.click();
                URL.revokeObjectURL(url);
            } catch (e) {
                alert('Não foi possível gerar o PDF.');
                console.error(e);
            } finally {
                btn.innerText = '📥 Baixar PDF';
            }
        }

        // Mensagem de boas-vindas
        exibirMensagem(MENSAGEM_INICIAL, 'ai');
    </script>
</body>
</html>
